<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c0903d" />
    <title>الراسيات · غير متصل</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      /* Brand tokens mirror apps/web/src/app/globals.css */
      :root { color-scheme: light; --gold: #c0903d; --gold-600: #8f6b2d; --gold-700: #795e2f; --gold-50: #faf7f2; --canvas: #f7f6f3; --text: #211f1c; --muted: #6f6b65; --border: #e8e7e5; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--canvas); color: var(--text); }
      body {
        font-family: "IBM Plex Sans Arabic", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
      .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 32px 24px 24px; text-align: center; }
      .logo { width: 96px; height: auto; margin: 0 auto 6px; display: block; }
      .latin { font-size: 9px; letter-spacing: .42em; color: var(--gold); margin: 0 0 22px; direction: ltr; }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p.body { font-size: 15px; line-height: 1.6; color: var(--muted); margin: 0 0 22px; }
      button { appearance: none; border: 0; border-radius: 8px; background: var(--gold-600); color: #fff; font: inherit; font-weight: 600; font-size: 16px; min-height: 48px; width: 100%; cursor: pointer; }
      button:active { background: var(--gold-700); }
    </style>
  </head>
  <body>
    <main>
      <div class="card" role="status">
        <img class="logo" src="/brand/logo-mark.svg" alt="الراسيات" />
        <p class="latin">ALRASIYAT</p>
        <h1 id="t">لا يوجد اتصال بالإنترنت</h1>
        <p class="body" id="b">تحتاج منصة الراسيات إلى اتصال لتحميل مهامك. سنعيد الاتصال تلقائياً.</p>
        <button id="r" type="button">إعادة المحاولة</button>
      </div>
    </main>
    <script>
      (function () {
        // Arabic is the default; English only when the user chose it (dt_locale=en).
        if (/(?:^|;\s*)dt_locale=en(?:;|$)/.test(document.cookie)) {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
          document.getElementById('t').textContent = "You're offline";
          document.getElementById('b').textContent = 'Al-Rasiyat needs a connection to load your tasks. We will reconnect automatically.';
          document.getElementById('r').textContent = 'Try again';
          document.title = 'Al-Rasiyat · Offline';
        }
        function retry() { window.location.reload(); }
        document.getElementById('r').addEventListener('click', retry);
        window.addEventListener('online', retry);
      })();
    </script>
  </body>
</html>
