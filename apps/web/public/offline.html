<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>DailyTasks · Offline</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #f6f8fb; color: #0f172a; }
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
        display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #fff; border-bottom: 1px solid #e2e8f0; font-weight: 600; }
      header img { width: 28px; height: 28px; border-radius: 8px; }
      main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
      .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px 24px; text-align: center; box-shadow: 0 1px 2px rgba(15, 23, 42, .05); }
      .dot { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; background: #fef3c7; display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #475569; margin: 0 0 20px; }
      button { appearance: none; border: 0; border-radius: 12px; background: #1f63e0; color: #fff; font: inherit; font-weight: 600; font-size: 16px; min-height: 48px; width: 100%; cursor: pointer; }
      button:active { background: #1a4fb5; }
    </style>
  </head>
  <body>
    <header><img src="/icon.svg" alt="" /> DailyTasks</header>
    <main>
      <div class="card" role="status">
        <div class="dot" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.43"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
        </div>
        <h1 id="t">You're offline</h1>
        <p id="b">DailyTasks needs a connection to load your tasks. We'll reconnect automatically.</p>
        <button id="r" type="button">Try again</button>
      </div>
    </main>
    <script>
      (function () {
        var ar = /(?:^|;\s*)dt_locale=ar(?:;|$)/.test(document.cookie);
        if (ar) {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
          document.getElementById('t').textContent = 'لا يوجد اتصال بالإنترنت';
          document.getElementById('b').textContent = 'يحتاج DailyTasks إلى اتصال لتحميل مهامك. سنعيد الاتصال تلقائياً.';
          document.getElementById('r').textContent = 'إعادة المحاولة';
          document.title = 'DailyTasks · غير متصل';
        }
        function retry() { window.location.reload(); }
        document.getElementById('r').addEventListener('click', retry);
        window.addEventListener('online', retry);
      })();
    </script>
  </body>
</html>
